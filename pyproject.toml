[project]
name = "interview-test"
version = "0.1.0"
description = "PySpark medallion pipeline building a provider daily activity gold table"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyspark==3.5.8",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".claude", "_bmad", "_bmad-output", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
